<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục trang web với CSS Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">Header - Tiêu đề trang web</header>
        <nav class="nav">Navigation - Thanh điều hướng</nav>
        <div class="main-container">
            <main class="content">
                <h2>Main Content</h2>
                <p>Khu vực hiển thị nội dung chính của trang web.</p>
            </main>
            <aside class="sidebar">
                <h3>Sidebar</h3>
                <p>Nội dung phụ, bài viết liên quan hoặc quảng cáo.</p>
            </aside>
        </div>
        <footer class="footer">Footer - Thông tin bản quyền & liên hệ</footer>
    </div>
</body>
</html>
